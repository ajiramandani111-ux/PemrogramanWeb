<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimpleTop | Tambah Laptop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

    <header>
        <h1><a href="../index.html">SimpleTop</a></h1>
        <button type="button" id="nav-toggle-btn" class="nav-toggle-label" aria-label="Menu">&#9776;</button>

        <nav>
            <ul>
                <li><a href="../index.html">Beranda</a></li>
                <li><a href="list.html">Daftar Laptop</a></li>
                <li><a href="tambah.html">Tambah Laptop</a></li>
                <li><a href="../bestseller/list.html">Best Seller</a></li>
                <li><a href="../bestseller/tambah.html">Tambah Best Seller</a></li>
            </ul>
        </nav>
    </header>

    <main class="form-container">
        <section>
            <h2>Tambah Laptop</h2>
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="merk">Merk</label>
                    <input type="text" id="merk" name="merk" placeholder="Contoh: ASUS" required>
                </div>

                <div class="form-group">
                    <label for="seri">Seri / Model</label>
                    <input type="text" id="seri" name="seri" placeholder="Contoh: ROG Strix G16" required>
                </div>

                <div class="form-group">
                    <label for="tahun">Tahun Keluaran</label>
                    <input type="number" id="tahun" name="tahun" min="2000" max="2026" required>
                </div>

                <div class="form-group">
                    <label for="harga">Harga (Rp)</label>
                    <input type="number" id="harga" name="harga" min="0" placeholder="Contoh: 15000000">
                </div>

                <div class="form-group">
                    <label for="stok">Stok</label>
                    <input type="number" id="stok" name="stok" min="0" required>
                </div>

                <div class="form-group">
                    <label for="kategori">Kategori</label>
                    <select id="kategori" name="kategori" required>
                        <option value="" disabled selected>-- Pilih Kategori --</option>
                        <option value="gaming">Gaming</option>
                        <option value="ultrabook">Ultrabook</option>
                        <option value="bisnis">Bisnis</option>
                        <option value="2in1">2-in-1</option>
                    </select>
                </div>

                <div class="form-actions">
                    <button type="submit">Simpan</button>
                    <a href="list.html" class="btn-batal">Batal</a>
                </div>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 SimpleTop &mdash; Toko Jual Beli Laptop</p>
    </footer>
    <script src="../assets/js/app.js"></script>
</body>
</html>
