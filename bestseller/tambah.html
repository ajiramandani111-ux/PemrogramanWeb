<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimpleTop | Tambah Best Seller</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

    <header>
        <h1><a href="../index.html">SimpleTop</a></h1>
        <button type="button" id="nav-toggle-btn" class="nav-toggle-label" aria-label="Menu">&#9776;</button>

        <nav>
            <ul>
                <li><a href="../index.html">Beranda</a></li>
                <li><a href="../laptop/list.html">Daftar Laptop</a></li>
                <li><a href="../laptop/tambah.html">Tambah Laptop</a></li>
                <li><a href="list.html">Best Seller</a></li>
                <li><a href="tambah.html">Tambah Best Seller</a></li>
            </ul>
        </nav>
    </header>

    <main class="form-container">
        <section>
            <h2>Tambah Data Best Seller</h2>
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="merk">Merk</label>
                    <input type="text" id="merk" name="merk" placeholder="Contoh: Apple" required>
                </div>

                <div class="form-group">
                    <label for="seri">Seri / Model</label>
                    <input type="text" id="seri" name="seri" placeholder="Contoh: MacBook Air M3" required>
                </div>

                <div class="form-group">
                    <label for="total_penjualan">Total Penjualan (unit)</label>
                    <input type="number" id="total_penjualan" name="total_penjualan" min="0" required>
                </div>

                <div class="form-group">
                    <label for="rating">Rating (1 - 5)</label>
                    <input type="number" id="rating" name="rating" min="1" max="5" step="0.1" required>
                </div>

                <div class="form-actions">
                    <button type="submit">Simpan</button>
                    <a href="list.html" class="btn-batal">Batal</a>
                </div>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 SimpleTop &mdash; Toko Jual Beli Laptop</p>
    </footer>
    <script src="../assets/js/app.js"></script>
</body>
</html>
